name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.15
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src scripts tests acceptance
      - run: uv run python scripts/check_contracts.py
      - run: uv run python scripts/smoke_mcp.py
      - run: uv run python scripts/check_release.py
