[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "matlab-companion"
version = "0.1.0a3"
description = "Host-neutral MATLAB workflows with validated results and editable native artifacts"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["mcp==2.2.0", "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5"]

[project.scripts]
matlab-companion = "matlab_companion.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matlab_companion"]

[tool.hatch.build.targets.wheel.force-include]
"matlab" = "matlab_companion/matlab"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
